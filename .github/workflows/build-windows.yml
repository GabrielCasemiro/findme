name: build-windows

# Builds the double-click Windows app. Run it from the Actions tab ("Run workflow"),
# or push a tag like v0.1.0 to also attach the zip to a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Needed so the tagged build can create/attach a GitHub Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build prerequisites
        run: python -m pip install --upgrade pip "numpy<2.2" cython

      - name: Install runtime dependencies
        run: |
          pip install "onnxruntime>=1.18" "opencv-python-headless>=4.9" "scikit-learn>=1.4" `
                      "pillow>=10.3" "fastapi>=0.115" "uvicorn[standard]>=0.30" `
                      "python-multipart>=0.0.9" pyinstaller
          pip install --no-build-isolation "insightface>=0.7.3"

      - name: Download face model (buffalo_l)
        run: python -c "from insightface.app import FaceAnalysis; FaceAnalysis(name='buffalo_l').prepare(ctx_id=-1)"

      - name: Build with PyInstaller
        run: pyinstaller findme.spec --noconfirm

      - name: Zip the app
        run: Compress-Archive -Path dist/findme/* -DestinationPath findme-windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: findme-windows
          path: findme-windows.zip

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: findme-windows.zip

[project]
name = "findme"
version = "0.1.0"
description = "Find yourself in a photo dump — local, private, open. Detect and cluster every face, then pick your own (optionally guided by a selfie)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "insightface>=0.7.3",
    "onnxruntime>=1.18",
    "opencv-python-headless>=4.9",
    "numpy>=1.26,<2.2",
    "scikit-learn>=1.4",
    "pillow>=10.3",
]

[tool.uv]
# This is an application, not a distributable library — don't try to build/install it.
package = false
